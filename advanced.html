<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTP 高级版</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #fff;
            --border: #d8dde6;
            --text: #111;
            --text-secondary: #475569;
            --accent: #75c1c4;
            --success: #16a34a;
            --danger: #ef4444;
            --warning: #d97706;
            --input-bg: #fff;
            --btn-secondary-bg: #e2e8f0;
            --btn-secondary-text: #111;
            --overlay-bg: rgba(15,23,42,.65);
            --overlay-panel-bg: rgba(255,255,255,.96);
            --scan-tip-color: #334155;
            --logo-stroke: #000000;
            --account-bg: #f8fafc;
            --account-active-bg: #e6f7f7;
            --account-active-border: #75c1c4;
            --account-border: #cbd5e1;
        }

        body.dark {
            --bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-secondary: #8b949e;
            --accent: #75c1c4;
            --success: #3fb950;
            --danger: #f85149;
            --warning: #d2991d;
            --input-bg: #0d1117;
            --btn-secondary-bg: #21262d;
            --btn-secondary-text: #c9d1d9;
            --overlay-bg: rgba(0,0,0,.75);
            --overlay-panel-bg: rgba(22,27,34,.96);
            --scan-tip-color: #8b949e;
            --logo-stroke: #c9d1d9;
            --account-bg: #0d1117;
            --account-active-bg: rgba(117,193,196,.08);
            --account-active-border: #75c1c4;
            --account-border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background .3s, color .3s;
        }
        .page { max-width: 760px; margin: 0 auto; padding: 20px; }

        /* Version Nav */
        .version-nav {
            display: flex; justify-content: center; gap: 6px; padding: 0 0 16px;
        }
        .version-nav a {
            padding: 4px 14px; border-radius: 6px; font-size: 13px;
            color: var(--text-secondary); text-decoration: none;
            border: 1px solid var(--border); transition: all .2s;
        }
        .version-nav a:hover { color: var(--text); border-color: var(--accent); }
        .version-nav a.active { background: var(--accent); border-color: var(--accent); color: #fff; }

        /* Header */
        header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        header .logo-svg { width: 38px; height: 38px; flex-shrink: 0; }
        header .logo-svg g path { stroke: var(--logo-stroke); }
        h1 { margin: 0; font-size: 1.6rem; }
        .header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

        /* Theme Toggle */
        .theme-toggle {
            background: none; border: 1px solid var(--border); border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; transition: all .2s; padding: 0;
        }
        .theme-toggle:hover { background: var(--btn-secondary-bg); }
        .theme-toggle svg { width: 20px; height: 20px; }
        .theme-toggle svg path { fill: var(--text-secondary); }
        body.dark .theme-toggle svg path { fill: #d2991d; }

        /* Panel / Card */
        .panel {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 16px;
            transition: background .3s, border-color .3s;
        }

        /* OTP Display */
        .otp-display { text-align: center; padding: 10px 0; }
        .otp-row { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .otp-code {
            font-size: 56px; font-weight: 700; letter-spacing: 10px;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', 'Menlo', monospace;
            color: var(--success); text-shadow: 0 0 20px rgba(22,163,74,.25);
            transition: color .3s; min-height: 67px; line-height: 1.2;
        }
        .otp-code.placeholder {
            color: var(--text-secondary); text-shadow: none; letter-spacing: 2px; font-size: 18px; font-weight: 400;
        }
        .otp-code.expiring {
            color: var(--warning); text-shadow: 0 0 20px rgba(217,119,6,.25);
            animation: pulse .5s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
        .copy-btn {
            background: none; border: 1px solid var(--border); border-radius: 8px;
            cursor: pointer; padding: 8px; display: flex; align-items: center; justify-content: center;
            transition: all .2s; flex-shrink: 0;
        }
        .copy-btn:hover { background: var(--btn-secondary-bg); border-color: var(--accent); }
        .copy-btn svg { width: 22px; height: 22px; }
        .copy-btn svg path { fill: var(--text-secondary); transition: fill .2s; }
        .copy-btn:hover svg path { fill: var(--accent); }
        .copy-btn.copied svg path { fill: var(--success); }

        /* Timer */
        .timer-bar-container { width: 100%; height: 5px; background: var(--border); border-radius: 3px; margin: 10px 0 6px; overflow: hidden; }
        .timer-bar { height: 100%; background: var(--success); border-radius: 3px; transition: width 1s linear, background .3s; }
        .timer-bar.expiring { background: var(--warning); }
        .timer-text { text-align: center; font-size: 13px; color: var(--text-secondary); }
        .account-info-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--input-bg); border-radius: 8px; margin-top: 8px; font-size: 13px; color: var(--text-secondary); }
        .account-info-bar .issuer { font-weight: 600; color: var(--text); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500;
            cursor: pointer; border: 1px solid var(--border); transition: all .2s;
            background: var(--card-bg); color: var(--text); white-space: nowrap;
            font-family: inherit;
        }
        .btn:hover { background: var(--btn-secondary-bg); border-color: #484f58; }
        .btn-primary { background: var(--accent); border-color: transparent; color: #fff; }
        .btn-primary:hover { opacity: .9; }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: rgba(248,81,73,.1); }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; border-radius: 8px; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-group.mb { margin-bottom: 16px; }

        /* Form */
        label { display: block; margin-bottom: 10px; font-size: .95rem; }
        input, textarea, select { width: 100%; padding: 10px 14px; font: inherit; font-size: 14px;
            background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); outline: none; transition: border-color .2s;
        }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(117,193,196,.12); }
        textarea { min-height: 72px; resize: vertical; }
        .row { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
        .status { margin-top: 8px; color: var(--text-secondary); font-size: 13px; }

        /* Account List */
        .account-list { display: grid; gap: 10px; }
        .account-item {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 12px 14px; border: 1px solid var(--account-border);
            border-radius: 10px; background: var(--account-bg); cursor: pointer; transition: all .2s;
        }
        .account-item:hover { border-color: var(--accent); }
        .account-item.active { border-color: var(--account-active-border); background: var(--account-active-bg); }
        .account-item .acc-name { font-weight: 500; font-size: 14px; }
        .account-item .acc-issuer { font-size: 12px; color: var(--text-secondary); }

        /* Overlay */
        .overlay { position: fixed; inset: 0; background: var(--overlay-bg); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
        .overlay.open { display: flex; }
        .overlay-panel { width: 100%; max-width: 520px; background: var(--overlay-panel-bg); border-radius: 18px; padding: 18px; box-shadow: 0 24px 48px rgba(15,23,42,.25); backdrop-filter: blur(10px); }
        .overlay h2 { margin-top: 0; }
        video { width: 100%; border-radius: 14px; background: #000; }
        .scan-tip { margin: 10px 0 0; color: var(--scan-tip-color); font-size: 13px; }
        .scan-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .otp-code { font-size: 40px; letter-spacing: 6px; }
            .row { grid-template-columns: 1fr; }
            .btn-group { flex-direction: column; }
            .btn-group .btn { width: 100%; }
            .btn-group.mb { flex-direction: row; }
            .btn-group.mb .btn { width: auto; }
        }
    </style>
</head>
<body>

                    </button>

            </div>

    <script>
        const STORAGE_KEY = 'totp_advanced_accounts';
        const ACTIVE_KEY = 'totp_advanced_active';
        let accounts = [];
        let currentIndex = -1;
        let scanStream = null;
        let scanActive = false;
        let detector = null;
        let scanRequest = null;
        let lastOTP = '';

        function setMessage(text) {
            document.getElementById('message').textContent = text;
        }

        function setScannerTip(text) {
            document.getElementById('scanTip').textContent = text;
        }

        function base32Decode(input) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            input = input.toUpperCase().replace(/[^A-Z2-7]/g, '');
            let bits = '';
            for (let i = 0; i < input.length; i++) {
                const val = alphabet.indexOf(input[i]);
                if (val < 0) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            const bytes = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) {
                bytes.push(parseInt(bits.slice(i, i + 8), 2));
            }
            return new Uint8Array(bytes);
        }

        async function hmacSha1(key, message) {
            const cryptoKey = await crypto.subtle.importKey('raw', key, { name:'HMAC', hash:'SHA-1' }, false, ['sign']);
            const sig = await crypto.subtle.sign('HMAC', cryptoKey, message);
            return new Uint8Array(sig);
        }

        function truncate(hmac) {
            const offset = hmac[19] & 0x0f;
            const num = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset+1] & 0xff) << 16) | ((hmac[offset+2] & 0xff) << 8) | (hmac[offset+3] & 0xff);
            return num % 1000000;
        }

        async function generateTOTP(secret, period = 30, digits = 6) {
            const key = base32Decode(secret);
            const now = Math.floor(Date.now() / 1000);
            const counter = new Uint8Array(8);
            let value = Math.floor(now / period);
            for (let i = 7; i >= 0; i--) {
                counter[i] = value & 0xff;
                value >>= 8;
            }
            const hmac = await hmacSha1(key, counter);
            return { code: truncate(hmac).toString().padStart(digits, '0'), left: period - (now % period) };
        }

        function parseOtpauth(value) {
            try {
                const url = new URL(value);
                if (url.protocol !== 'otpauth:') return null;
                const secret = url.searchParams.get('secret');
                if (!secret) return null;
                let account = url.pathname.replace(/^\//, '');
                let issuer = url.searchParams.get('issuer') || '';
                if (account.includes(':')) {
                    const parts = account.split(':');
                    issuer = issuer || parts[0];
                    account = parts.slice(1).join(':');
                }
                return { secret, account: decodeURIComponent(account), issuer: decodeURIComponent(issuer), period: parseInt(url.searchParams.get('period')) || 30, digits: parseInt(url.searchParams.get('digits')) || 6 };
            } catch (e) {
                return null;
            }
        }

        function cleanSecret(input) {
            const raw = input.trim();
            const parsed = parseOtpauth(raw);
            if (parsed) return parsed;
            const cleaned = raw.replace(/^secret[=:]\s*/i, '').toUpperCase().replace(/[^A-Z2-7]/g, '');
            if (cleaned.length < 16) return null;
            return { secret: cleaned, account:'', issuer:'', period:30, digits:6 };
        }

        function saveAccounts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
            localStorage.setItem(ACTIVE_KEY, currentIndex.toString());
        }

        function loadAccounts() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                accounts = data ? JSON.parse(data) : [];
                const saved = parseInt(localStorage.getItem(ACTIVE_KEY));
                currentIndex = !Number.isNaN(saved) && saved >= 0 && saved < accounts.length ? saved : accounts.length > 0 ? 0 : -1;
            } catch (e) {
                accounts = [];
                currentIndex = -1;
            }
        }

        async function renderAccountList() {
            const container = document.getElementById('accountList');
            if (accounts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-secondary);">暂无账户</div>';
                return;
            }
            let html = '';
            for (let i = 0; i < accounts.length; i++) {
                const acc = accounts[i];
                const isActive = i === currentIndex;
                let otpDisplay = '------';
                try {
                    const { code } = await generateTOTP(acc.secret, acc.period, acc.digits);
                    otpDisplay = code;
                } catch (e) {
                    otpDisplay = 'ERROR';
                }
                html += `<div class="account-item${isActive ? ' active' : ''}" onclick="selectAccount(${i})">
                    <div>
                        <div class="acc-name">${escapeHtml(acc.account)}</div>
                        <div class="acc-issuer">${escapeHtml(acc.issuer || '未知服务商')}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span style="font-family:monospace;font-size:1.1rem;font-weight:600;">${otpDisplay}</span>
                        <button class="btn btn-sm btn-danger" onclick="event.stopPropagation();removeAccount(${i})">删除</button>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function selectAccount(index) {
            if (index < 0 || index >= accounts.length) return;
            currentIndex = index;
            saveAccounts();
            updateDisplay();
        }

        function updateDisplay() {
            const otpEl = document.getElementById('otpCode');
            const timerBar = document.getElementById('timerBar');
            const timerText = document.getElementById('timerText');
            const accountInfo = document.getElementById('activeAccountInfo');
            const copyBtn = document.getElementById('copyBtn');

            if (currentIndex < 0 || !accounts[currentIndex]) {
                otpEl.textContent = '请添加并选择账户';
                otpEl.className = 'otp-code placeholder';
                timerBar.style.width = '0%';
                timerBar.classList.remove('expiring');
                timerText.textContent = '等待添加账户...';
                accountInfo.style.display = 'none';
                copyBtn.style.display = 'none';
                lastOTP = '';
                renderAccountList();
                return;
            }

            const account = accounts[currentIndex];
            document.getElementById('activeIssuer').textContent = account.issuer || '未知';
            document.getElementById('activeAccount').textContent = account.account;
            accountInfo.style.display = 'flex';
            copyBtn.style.display = '';

            generateTOTP(account.secret, account.period, account.digits).then(({ code, left }) => {
                otpEl.textContent = code;
                lastOTP = code;
                const pct = (left / account.period) * 100;
                timerBar.style.width = pct + '%';
                timerText.textContent = `剩余 ${left} 秒`;

                otpEl.classList.remove('placeholder', 'expiring');
                timerBar.classList.remove('expiring');
                if (left <= 5 && left > 0) {
                    otpEl.classList.add('expiring');
                    timerBar.classList.add('expiring');
                }
            }).catch(() => {
                otpEl.textContent = '密钥格式错误';
                otpEl.className = 'otp-code placeholder';
                timerBar.style.width = '0%';
                timerText.textContent = '';
                lastOTP = '';
            });
            renderAccountList();
        }

        async function addAccount() {
            const input = document.getElementById('secretInput').value;
            const name = document.getElementById('accountName').value.trim();
            const issuer = document.getElementById('issuerName').value.trim();
            if (!input.trim()) { setMessage('请输入密钥或 otpauth 链接'); return; }
            const cleaned = cleanSecret(input);
            if (!cleaned) { setMessage('无效密钥，请检查格式'); return; }
            if (accounts.some(a => a.secret === cleaned.secret)) { setMessage('该密钥已存在'); return; }
            accounts.push({ secret: cleaned.secret, account: name || cleaned.account || `账户 ${accounts.length + 1}`, issuer: issuer || cleaned.issuer || '', period: cleaned.period, digits: cleaned.digits });
            currentIndex = accounts.length - 1;
            saveAccounts();
            updateDisplay();
            setMessage('账户已添加');
            document.getElementById('secretInput').value = '';
            document.getElementById('accountName').value = '';
            document.getElementById('issuerName').value = '';
        }

        function removeAccount(index) {
            if (index < 0 || index >= accounts.length) return;
            accounts.splice(index, 1);
            currentIndex = accounts.length > 0 ? Math.min(index, accounts.length - 1) : -1;
            saveAccounts();
            updateDisplay();
            setMessage('账户已删除');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
        }

        function importBackup() {
            document.getElementById('jsonFile').click();
        }

        function importAccounts(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data.accounts)) throw new Error('格式错误');
                    let count = 0;
                    data.accounts.forEach(acc => {
                        if (!acc.secret) return;
                        if (!accounts.some(a => a.secret === acc.secret)) {
                            accounts.push({ secret: acc.secret, account: acc.account || `账户 ${accounts.length + 1}`, issuer: acc.issuer || '', period: acc.period || 30, digits: acc.digits || 6 });
                            count++;
                        }
                    });
                    if (count) {
                        currentIndex = accounts.length - 1;
                        saveAccounts();
                        updateDisplay();
                        setMessage(`已导入 ${count} 个账户`);
                    } else {
                        setMessage('没有新的账户可导入');
                    }
                } catch (err) {
                    setMessage('导入失败，请检查文件格式');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        async function ensureDetector() {
            if (detector) return detector;
            if (!window.BarcodeDetector) return null;
            try {
                const formats = await BarcodeDetector.getSupportedFormats();
                if (!formats.includes('qr_code')) return null;
                detector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (err) {
                detector = null;
            }
            return detector;
        }

        function closeScanStream() {
            if (scanStream) {
                scanStream.getTracks().forEach(track => track.stop());
                scanStream = null;
            }
            if (scanRequest) {
                cancelAnimationFrame(scanRequest);
                scanRequest = null;
            }
            scanActive = false;
        }

        async function openScanner() {
            closeScanStream();
            document.getElementById('scanOverlay').classList.add('open');
            setScannerTip('申请摄像头权限，请允许访问。');
            const localDetector = await ensureDetector();
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                scanActive = true;
                const video = document.getElementById('scanVideo');
                video.srcObject = scanStream;
                await video.play();
                if (localDetector) {
                    scanFrame();
                } else {
                    setScannerTip('当前浏览器不支持本地扫码，可点击"网络识别二维码"识别当前画面。');
                }
            } catch (err) {
                setScannerTip('无法打开摄像头，改用上传图片或请检查权限。');
            }
        }

        function closeScanner() {
            scanActive = false;
            document.getElementById('scanOverlay').classList.remove('open');
            if (scanStream) {
                scanStream.getTracks().forEach(track => track.stop());
                scanStream = null;
            }
            if (scanRequest) {
                cancelAnimationFrame(scanRequest);
                scanRequest = null;
            }
        }

        function stopScanner() {
            closeScanner();
            setScannerTip('扫码已停止。');
        }

        async function scanFrame() {
            if (!scanActive) return;
            const video = document.getElementById('scanVideo');
            if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                scanRequest = requestAnimationFrame(scanFrame);
                return;
            }
            try {
                const bitmap = await createImageBitmap(video);
                const results = await detector.detect(bitmap);
                bitmap.close();
                if (results && results.length > 0) {
                    const text = results[0].rawValue;
                    if (handleScannedText(text)) return;
                }
            } catch (err) {
                console.warn('扫码帧处理失败，继续尝试', err);
            }
            scanRequest = requestAnimationFrame(scanFrame);
        }

        function chooseScanImage() {
            document.getElementById('scanImageInput').click();
        }

        async function handleImageFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const localDetector = await ensureDetector();
            if (window.BarcodeDetector && localDetector) {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = async () => {
                    const bitmap = await createImageBitmap(img);
                    const results = await localDetector.detect(bitmap);
                    bitmap.close();
                    URL.revokeObjectURL(img.src);
                    if (results && results.length > 0) {
                        handleScannedText(results[0].rawValue);
                    } else {
                        setScannerTip('图片中未识别到二维码，可尝试网络识别。');
                    }
                };
            } else {
                setScannerTip('正在使用网络识别图片二维码...');
                uploadImageForRecognition(file);
            }
            event.target.value = '';
        }

        async function captureCurrentFrame() {
            const video = document.getElementById('scanVideo');
            if (!video || !video.srcObject) {
                setScannerTip('当前没有可识别的视频画面。');
                return null;
            }
            const vw = video.videoWidth || 0;
            const vh = video.videoHeight || 0;
            if (vw === 0 || vh === 0) {
                setScannerTip('视频画面尚未就绪，请稍后重试。');
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = vw;
            canvas.height = vh;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        }

        async function networkScanFrame() {
            const overlay = document.getElementById('scanOverlay');
            if (!overlay.classList.contains('open')) {
                overlay.classList.add('open');
            }
            if (!scanStream) {
                try {
                    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                    const video = document.getElementById('scanVideo');
                    video.srcObject = scanStream;
                    await video.play();
                } catch (err) {
                    setScannerTip('无法打开摄像头，请上传二维码图片或使用屏幕捕捉。');
                    return;
                }
            }
            const blob = await captureCurrentFrame();
            if (!blob) return;
            setScannerTip('正在通过网络识别当前画面中的二维码...');
            await uploadImageForRecognition(blob);
        }

        async function captureScreen() {
            closeScanStream();
            document.getElementById('scanOverlay').classList.add('open');
            setScannerTip('请求捕捉屏幕，请选择一个窗口或屏幕。');
            const localDetector = await ensureDetector();
            try {
                scanStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                if (!scanStream) {
                    setScannerTip('屏幕捕捉失败。');
                    return;
                }
                scanActive = true;
                const video = document.getElementById('scanVideo');
                video.srcObject = scanStream;
                await video.play();
                if (localDetector) {
                    scanFrame();
                    setScannerTip('正在本地识别屏幕中的二维码，识别失败可使用网络识别。');
                } else {
                    setScannerTip('本地二维码识别不可用，请点击"网络识别二维码"或上传二维码图片。');
                }
            } catch (err) {
                console.warn('屏幕捕捉失败', err);
                setScannerTip('屏幕捕捉权限被拒绝或不支持。');
            }
        }

        async function uploadImageForRecognition(file) {
            try {
                const form = new FormData();
                form.append('file', file);
                const response = await fetch('https://api.qrserver.com/v1/read-qr-code/', { method:'POST', body:form });
                const result = await response.json();
                if (Array.isArray(result) && result[0] && result[0].symbol && result[0].symbol[0] && result[0].symbol[0].data) {
                    handleScannedText(result[0].symbol[0].data);
                } else {
                    setScannerTip('网络识别失败，请重试其他图片。');
                }
            } catch (err) {
                setScannerTip('网络识别出错，请检查连接。');
            }
        }

        function handleScannedText(text) {
            setScannerTip('已识别到二维码内容，正在添加账户...');
            const cleaned = cleanSecret(text);
            if (!cleaned) {
                setScannerTip('二维码内容不是有效的 TOTP 密钥或 otpauth 链接，继续扫描...');
                return false;
            }
            if (accounts.some(a => a.secret === cleaned.secret)) {
                setScannerTip('该账号已存在，继续扫描...');
                return false;
            }
            accounts.push({ secret: cleaned.secret, account: cleaned.account || `账户 ${accounts.length + 1}`, issuer: cleaned.issuer || '', period: cleaned.period, digits: cleaned.digits });
            currentIndex = accounts.length - 1;
            saveAccounts();
            updateDisplay();
            setMessage('扫码账号已添加');
            setScannerTip('账号已加入，扫码窗口可关闭。');
            closeScanner();
            return true;
        }

        async function copyOTP() {
            if (!lastOTP) return;
            try {
                await navigator.clipboard.writeText(lastOTP);
                const btn = document.getElementById('copyBtn');
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 1500);
            } catch (e) {
                // fallback
                const ta = document.createElement('textarea');
                ta.value = lastOTP;
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
            }
        }

        function applyTheme() {
            const saved = localStorage.getItem('totp_advanced_theme');
            if (saved === 'dark') {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            localStorage.setItem('totp_advanced_theme', isDark ? 'dark' : 'light');
        }

        function init() {
            applyTheme();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);
            loadAccounts();
            updateDisplay();
            setInterval(updateDisplay, 1000);
            setScannerTip('点击"开启扫码识别模式"即可开始。');
            console.log('高级 TOTP 已就绪');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOTP 高级版</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background:#f5f7fa; color:#111; }
        .page { max-width:760px; margin:0 auto; padding:20px; }
        header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
        header svg { width:38px; height:38px; }
        h1 { margin:0; font-size:1.6rem; }
        .panel { background:#fff; border:1px solid #d8dde6; border-radius:16px; padding:18px; margin-bottom:18px; }
        label { display:block; margin-bottom:10px; font-size:0.95rem; }
        input, textarea, button, select { width:100%; font:inherit; }
        textarea { min-height:72px; resize:vertical; }
        .row { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
        .btn { border:none; border-radius:10px; padding:12px 16px; cursor:pointer; transition:transform .15s ease; }
        .btn:hover { transform:scale(1.01); }
        .btn-primary { background:#2563eb; color:#fff; }
        .btn-secondary { background:#e2e8f0; color:#111; }
        .btn-danger { background:#ef4444; color:#fff; }
        .status { margin-top:8px; color:#475569; }
        .account-list { display:grid; gap:12px; }
        .account-item { display:flex; justify-content:space-between; gap:12px; padding:12px 14px; border:1px solid #cbd5e1; border-radius:12px; background:#f8fafc; }
        .account-item.active { border-color:#2563eb; background:#e0f2fe; }
        .overlay { position:fixed; inset:0; background:rgba(15,23,42,.65); display:none; align-items:center; justify-content:center; padding:20px; z-index:1000; }
        .overlay.open { display:flex; }
        .overlay-panel { width:100%; max-width:520px; background:rgba(255,255,255,.96); border-radius:18px; padding:18px; box-shadow:0 24px 48px rgba(15,23,42,.25); backdrop-filter:blur(10px); }
        .overlay h2 { margin-top:0; }
        video { width:100%; border-radius:14px; background:#000; }
        .scan-tip { margin:10px 0 0; color:#334155; }
        .scan-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
        .hidden { display:none !important; }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <svg viewBox="0 0 39.31004 41.94494" xmlns="http://www.w3.org/2000/svg" width="39.31004" height="41.94494">
                <g transform="translate(-188.88763,-154.88446)">
                    <g fill="none" stroke="#000000" stroke-width="2" stroke-miterlimit="10">
                        <path d="M219.84633,187.09038v2.9813c0,3.1799 -2.57781,5.75772 -5.75771,5.75772h-18.44327c-3.1799,0 -5.75771,-2.57782 -5.75771,-5.75772v-28.4295c0,-3.1799 2.57781,-5.75772 5.75771,-5.75772h18.44327c3.1799,0 5.75771,2.57782 5.75771,5.75772v0.75409"/>
                        <path d="M227.19767,158.4247v12.62462c0,2.73834 -2.21986,4.9582 -4.9582,4.9582h-8.5567c-2.73834,0 -4.9582,-2.21986 -4.9582,-4.9582v-8.3648"/>
                        <path d="M208.71655,190.72398v-9.61743c0,-2.73834 2.21986,-4.9582 4.9582,-4.9582h8.5567c2.73834,0 4.9582,2.21986 4.9582,4.9582v15.12988"/>
                    </g>
                </g>
            </svg>
            <div>
                <h1>TOTP 高级版</h1>
                <div class="status">离线可用，支持扫码识别，自动添加账户。</div>
            </div>
        </header>

        <section class="panel">
            <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
                <button class="btn btn-primary" onclick="openScanner()">开启摄像头扫码</button>
                <button class="btn btn-secondary" onclick="captureScreen()">捕捉屏幕画面</button>
                <button class="btn btn-secondary" onclick="stopScanner()">停止扫码</button>
                <button class="btn btn-secondary" onclick="networkScanFrame()">网络识别当前画面</button>
            </div>
            <div class="status" id="scannerStatus">扫码窗口会在屏幕上方显示。支持本地扫码、屏幕捕捉或网络识别。</div>
        </section>

        <section class="panel">
            <h2>添加账户</h2>
            <label>密钥或 otpauth 链接
                <textarea id="secretInput" placeholder="JBSWY3DPEHPK3PXP 或 otpauth://totp/..." rows="4"></textarea>
            </label>
            <div class="row">
                <label>账户名（可选）<input id="accountName" placeholder="例如：my-account"></label>
                <label>服务商（可选）<input id="issuerName" placeholder="例如：GitHub"></label>
            </div>
            <div class="scan-actions">
                <button class="btn btn-primary" onclick="addAccount()">添加账户</button>
                <button class="btn btn-secondary" onclick="importBackup()">导入备份</button>
            </div>
            <div class="status" id="message"></div>
            <input type="file" id="jsonFile" accept="application/json" class="hidden" onchange="importAccounts(event)">
        </section>

        <section class="panel">
            <h2>当前验证码</h2>
            <div id="otpOutput" style="font-family:monospace; font-size:1.8rem; padding:18px 0;">请添加并选择账户</div>
            <div id="timerText" class="status"></div>
        </section>

        <section class="panel">
            <h2>已保存账户</h2>
            <div class="account-list" id="accountList">暂无账户</div>
        </section>
    </div>

    <div class="overlay" id="scanOverlay">
        <div class="overlay-panel">
            <h2>扫码识别模式</h2>
            <video id="scanVideo" autoplay muted playsinline></video>
            <div class="scan-tip" id="scanTip">正在尝试打开摄像头并本地识别 QR 码。</div>
            <div class="scan-actions">
                <button class="btn btn-secondary" onclick="closeScanner()">关闭扫码窗口</button>
                <button class="btn btn-primary" onclick="chooseScanImage()">上传二维码图片</button>
                <button class="btn btn-primary" onclick="networkScanFrame()">网络识别二维码</button>
            </div>
            <input type="file" id="scanImageInput" accept="image/*" class="hidden" onchange="handleImageFile(event)">
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'totp_advanced_accounts';
        const ACTIVE_KEY = 'totp_advanced_active';
        let accounts = [];
        let currentIndex = -1;
        let scanStream = null;
        let scanActive = false;
        let detector = null;
        let scanRequest = null;

        function setMessage(text) {
            document.getElementById('message').textContent = text;
        }

        function setScannerTip(text) {
            document.getElementById('scanTip').textContent = text;
        }

        async function base32Decode(input) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
            input = input.toUpperCase().replace(/[^A-Z2-7]/g, '');
            let bits = '';
            for (let i = 0; i < input.length; i++) {
                const val = alphabet.indexOf(input[i]);
                if (val < 0) continue;
                bits += val.toString(2).padStart(5, '0');
            }
            const bytes = [];
            for (let i = 0; i + 8 <= bits.length; i += 8) {
                bytes.push(parseInt(bits.slice(i, i + 8), 2));
            }
            return new Uint8Array(bytes);
        }

        async function hmacSha1(key, message) {
            const cryptoKey = await crypto.subtle.importKey('raw', key, { name:'HMAC', hash:'SHA-1' }, false, ['sign']);
            const sig = await crypto.subtle.sign('HMAC', cryptoKey, message);
            return new Uint8Array(sig);
        }

        function truncate(hmac) {
            const offset = hmac[19] & 0x0f;
            const num = ((hmac[offset] & 0x7f) << 24) | ((hmac[offset+1] & 0xff) << 16) | ((hmac[offset+2] & 0xff) << 8) | (hmac[offset+3] & 0xff);
            return num % 1000000;
        }

        async function generateTOTP(secret, period = 30, digits = 6) {
            const key = base32Decode(secret);
            const now = Math.floor(Date.now() / 1000);
            const counter = new Uint8Array(8);
            let value = Math.floor(now / period);
            for (let i = 7; i >= 0; i--) {
                counter[i] = value & 0xff;
                value >>= 8;
            }
            const hmac = await hmacSha1(key, counter);
            return truncate(hmac).toString().padStart(digits, '0');
        }

        function parseOtpauth(value) {
            try {
                const url = new URL(value);
                if (url.protocol !== 'otpauth:') return null;
                const secret = url.searchParams.get('secret');
                if (!secret) return null;
                let account = url.pathname.replace(/^\//, '');
                let issuer = url.searchParams.get('issuer') || '';
                if (account.includes(':')) {
                    const parts = account.split(':');
                    issuer = issuer || parts[0];
                    account = parts.slice(1).join(':');
                }
                return { secret, account: decodeURIComponent(account), issuer: decodeURIComponent(issuer), period: parseInt(url.searchParams.get('period')) || 30, digits: parseInt(url.searchParams.get('digits')) || 6 };
            } catch (e) {
                return null;
            }
        }

        function cleanSecret(input) {
            const raw = input.trim();
            const parsed = parseOtpauth(raw);
            if (parsed) return parsed;
            const cleaned = raw.replace(/^secret[=:]\s*/i, '').toUpperCase().replace(/[^A-Z2-7]/g, '');
            if (cleaned.length < 16) return null;
            return { secret: cleaned, account:'', issuer:'', period:30, digits:6 };
        }

        function saveAccounts() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
            localStorage.setItem(ACTIVE_KEY, currentIndex.toString());
        }

        function loadAccounts() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                accounts = data ? JSON.parse(data) : [];
                const saved = parseInt(localStorage.getItem(ACTIVE_KEY));
                currentIndex = !Number.isNaN(saved) && saved >= 0 && saved < accounts.length ? saved : accounts.length > 0 ? 0 : -1;
            } catch (e) {
                accounts = [];
                currentIndex = -1;
            }
        }

        function renderAccountList() {
            const container = document.getElementById('accountList');
            if (accounts.length === 0) {
                container.innerHTML = '<div>暂无账户</div>';
                return;
            }
            container.innerHTML = '';
            accounts.forEach((acc, index) => {
                const item = document.createElement('div');
                item.className = 'account-item' + (index === currentIndex ? ' active' : '');
                const left = document.createElement('div');
                left.innerHTML = `<strong>${escapeHtml(acc.account)}</strong><div style="font-size:0.9rem;color:#475569;">${escapeHtml(acc.issuer || '未知服务商')}</div>`;
                const right = document.createElement('div');
                right.style.textAlign = 'right';
                const otp = document.createElement('div');
                otp.textContent = '------';
                otp.style.fontFamily = 'monospace';
                otp.style.fontSize = '1rem';
                right.appendChild(otp);
                const btn = document.createElement('button');
                btn.className = 'btn btn-danger';
                btn.textContent = '删除';
                btn.style.width = '100%';
                btn.onclick = (e) => { e.stopPropagation(); removeAccount(index); };
                right.appendChild(btn);
                item.appendChild(left);
                item.appendChild(right);
                item.onclick = () => { currentIndex = index; saveAccounts(); updateDisplay(); };
                container.appendChild(item);
            });
        }

        function updateDisplay() {
            const output = document.getElementById('otpOutput');
            const timerText = document.getElementById('timerText');
            if (currentIndex < 0 || !accounts[currentIndex]) {
                output.textContent = '请添加并选择账户';
                timerText.textContent = '';
                renderAccountList();
                return;
            }
            const account = accounts[currentIndex];
            output.textContent = '正在生成...';
            generateTOTP(account.secret, account.period, account.digits).then(code => {
                output.textContent = code;
                const now = Math.floor(Date.now()/1000);
                const left = account.period - (now % account.period);
                timerText.textContent = `剩余 ${left} 秒`; 
            }).catch(() => {
                output.textContent = '密钥格式错误';
                timerText.textContent = '';
            });
            renderAccountList();
        }

        async function addAccount() {
            const input = document.getElementById('secretInput').value;
            const name = document.getElementById('accountName').value.trim();
            const issuer = document.getElementById('issuerName').value.trim();
            if (!input.trim()) { setMessage('请输入密钥或 otpauth 链接'); return; }
            const cleaned = cleanSecret(input);
            if (!cleaned) { setMessage('无效密钥，请检查格式'); return; }
            if (accounts.some(a => a.secret === cleaned.secret)) { setMessage('该密钥已存在'); return; }
            accounts.push({ secret: cleaned.secret, account: name || cleaned.account || `账户 ${accounts.length + 1}`, issuer: issuer || cleaned.issuer || '', period: cleaned.period, digits: cleaned.digits });
            currentIndex = accounts.length - 1;
            saveAccounts();
            renderAccountList();
            updateDisplay();
            setMessage('账户已添加');
            document.getElementById('secretInput').value = '';
            document.getElementById('accountName').value = '';
            document.getElementById('issuerName').value = '';
        }

        function removeAccount(index) {
            if (index < 0 || index >= accounts.length) return;
            accounts.splice(index, 1);
            currentIndex = accounts.length > 0 ? Math.min(index, accounts.length - 1) : -1;
            saveAccounts();
            renderAccountList();
            updateDisplay();
            setMessage('账户已删除');
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
        }

        function importBackup() {
            document.getElementById('jsonFile').click();
        }

        function importAccounts(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!Array.isArray(data.accounts)) throw new Error('格式错误');
                    let count = 0;
                    data.accounts.forEach(acc => {
                        if (!acc.secret) return;
                        if (!accounts.some(a => a.secret === acc.secret)) {
                            accounts.push({ secret: acc.secret, account: acc.account || `账户 ${accounts.length + 1}`, issuer: acc.issuer || '', period: acc.period || 30, digits: acc.digits || 6 });
                            count++;
                        }
                    });
                    if (count) {
                        currentIndex = accounts.length - 1;
                        saveAccounts();
                        renderAccountList();
                        updateDisplay();
                        setMessage(`已导入 ${count} 个账户`);
                    } else {
                        setMessage('没有新的账户可导入');
                    }
                } catch (err) {
                    setMessage('导入失败，请检查文件格式');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        async function ensureDetector() {
            if (detector) return detector;
            if (!window.BarcodeDetector) return null;
            try {
                const formats = await BarcodeDetector.getSupportedFormats();
                if (!formats.includes('qr_code')) return null;
                detector = new BarcodeDetector({ formats: ['qr_code'] });
            } catch (err) {
                detector = null;
            }
            return detector;
        }

        function closeScanStream() {
            if (scanStream) {
                scanStream.getTracks().forEach(track => track.stop());
                scanStream = null;
            }
            if (scanRequest) {
                cancelAnimationFrame(scanRequest);
                scanRequest = null;
            }
            scanActive = false;
        }

        async function openScanner() {
            closeScanStream();
            document.getElementById('scanOverlay').classList.add('open');
            setScannerTip('申请摄像头权限，请允许访问。');
            const localDetector = await ensureDetector();
            try {
                scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                scanActive = true;
                const video = document.getElementById('scanVideo');
                video.srcObject = scanStream;
                await video.play();
                if (localDetector) {
                    scanFrame();
                } else {
                    setScannerTip('当前浏览器不支持本地扫码，可点击“网络识别二维码”识别当前画面。');
                }
            } catch (err) {
                setScannerTip('无法打开摄像头，改用上传图片或请检查权限。');
            }
        }

        function closeScanner() {
            scanActive = false;
            document.getElementById('scanOverlay').classList.remove('open');
            if (scanStream) {
                scanStream.getTracks().forEach(track => track.stop());
                scanStream = null;
            }
            if (scanRequest) {
                cancelAnimationFrame(scanRequest);
                scanRequest = null;
            }
        }

        function stopScanner() {
            closeScanner();
            setScannerTip('扫码已停止。');
        }

        async function scanFrame() {
            if (!scanActive) return;
            const video = document.getElementById('scanVideo');
            if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) {
                scanRequest = requestAnimationFrame(scanFrame);
                return;
            }
            try {
                const bitmap = await createImageBitmap(video);
                const results = await detector.detect(bitmap);
                bitmap.close();
                if (results && results.length > 0) {
                    const text = results[0].rawValue;
                    handleScannedText(text);
                    return;
                }
            } catch (err) {
                console.warn('扫码失败', err);
                setScannerTip('本地扫码失败，您可以点击“网络识别当前画面”或上传二维码图片。');
                detector = null;
                return;
            }
            scanRequest = requestAnimationFrame(scanFrame);
        }

        function chooseScanImage() {
            document.getElementById('scanImageInput').click();
        }

        async function handleImageFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (window.BarcodeDetector && detector) {
                const img = new Image();
                img.src = URL.createObjectURL(file);
                img.onload = async () => {
                    const bitmap = await createImageBitmap(img);
                    const results = await detector.detect(bitmap);
                    bitmap.close();
                    URL.revokeObjectURL(img.src);
                    if (results && results.length > 0) {
                        handleScannedText(results[0].rawValue);
                    } else {
                        setScannerTip('图片中未识别到二维码。');
                    }
                };
            } else {
                setScannerTip('正在使用网络识别图片二维码...');
                uploadImageForRecognition(file);
            }
            event.target.value = '';
        }

        async function captureCurrentFrame() {
            const video = document.getElementById('scanVideo');
            if (!video || !video.srcObject) {
                setScannerTip('当前没有可识别的视频画面。');
                return null;
            }
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        }

        async function networkScanFrame() {
            const blob = await captureCurrentFrame();
            if (!blob) return;
            setScannerTip('正在通过网络识别当前画面中的二维码...');
            await uploadImageForRecognition(blob);
        }

        async function captureScreen() {
            closeScanStream();
            document.getElementById('scanOverlay').classList.add('open');
            setScannerTip('请求捕捉屏幕，请选择一个窗口或屏幕。');
            const localDetector = await ensureDetector();
            try {
                scanStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                if (!scanStream) {
                    setScannerTip('屏幕捕捉失败。');
                    return;
                }
                scanActive = true;
                const video = document.getElementById('scanVideo');
                video.srcObject = scanStream;
                await video.play();
                if (localDetector) {
                    scanFrame();
                    setScannerTip('正在本地识别屏幕中的二维码，识别失败可使用网络识别。');
                } else {
                    setScannerTip('本地二维码识别不可用，请点击“网络识别当前画面”或上传二维码图片。');
                }
            } catch (err) {
                console.warn('屏幕捕捉失败', err);
                setScannerTip('屏幕捕捉权限被拒绝或不支持。');
            }
        }

        async function uploadImageForRecognition(file) {
            try {
                const form = new FormData();
                form.append('file', file);
                const response = await fetch('https://api.qrserver.com/v1/read-qr-code/', { method:'POST', body:form });
                const result = await response.json();
                if (Array.isArray(result) && result[0] && result[0].symbol && result[0].symbol[0] && result[0].symbol[0].data) {
                    handleScannedText(result[0].symbol[0].data);
                } else {
                    setScannerTip('网络识别失败，请重试其他图片。');
                }
            } catch (err) {
                setScannerTip('网络识别出错，请检查连接。');
            }
        }

        function handleScannedText(text) {
            setScannerTip('已识别到二维码内容，正在添加账户...');
            const cleaned = cleanSecret(text);
            if (!cleaned) {
                setScannerTip('二维码内容不是有效的 TOTP 密钥或 otpauth 链接。');
                return;
            }
            if (accounts.some(a => a.secret === cleaned.secret)) {
                setScannerTip('该账号已存在。');
                return;
            }
            accounts.push({ secret: cleaned.secret, account: cleaned.account || `账户 ${accounts.length + 1}`, issuer: cleaned.issuer || '', period: cleaned.period, digits: cleaned.digits });
            currentIndex = accounts.length - 1;
            saveAccounts();
            renderAccountList();
            updateDisplay();
            setMessage('扫码账号已添加');
            setScannerTip('账号已加入，扫码窗口可关闭。');
            closeScanner();
        }

        function init() {
            loadAccounts();
            renderAccountList();
            updateDisplay();
            setInterval(updateDisplay, 1000);
            setScannerTip('点击“开启扫码识别模式”即可开始。');
            console.log('高级 TOTP 已就绪');
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
